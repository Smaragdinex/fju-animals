<body>
<canvas id="scene"></canvas>
<div id="labels"></div>
<nav id="dots" aria-label="動物列表"></nav>
<main id="story"></main>
<div id="loading">校園載入中…</div>
<script>
// 載入失敗時把錯誤寫在載入畫面上（手機上看不到 console，不然只會一直停在「載入中」）
(function () {
  const show = (msg) => {
    const el = document.getElementById('loading')
    if (!el || el.classList.contains('done')) return
    let d = el.querySelector('.err')
    if (!d) { d = document.createElement('div'); d.className = 'err'; d.style.cssText = 'font:12px/1.4 monospace;color:#a33;margin-top:12px;max-width:90vw;white-space:pre-wrap;word-break:break-all'; el.appendChild(d) }
    d.textContent += String(msg).slice(0, 400) + '\n'
  }
  addEventListener('error', (e) => show('錯誤：' + (e.message || e.target?.src || e.target?.href || e) + (e.filename ? '\n' + e.filename.split('/').pop() + ':' + e.lineno : '')), true)
  addEventListener('unhandledrejection', (e) => show('錯誤：' + (e.reason?.stack || e.reason?.message || e.reason)))
  window.__fjuStep = (s) => { const el = document.getElementById('loading'); if (el && !el.classList.contains('done')) el.firstChild.textContent = '校園載入中…（' + s + '）' }
})()
</script>
<!-- ?v= 是版本號：GitHub Pages 會把 JS 和模型快取 10 分鐘，每次部署跑 tools/bump-version.sh 換號才會馬上看到新版 -->
<script type="module" src="src/main.js?v=1794058299"></script>
